# main にpushしたら、ビルドして、Cloudflare に自動でデプロイする（まいか側）。
# トークンは、GitHub の Secrets（CLOUDFLARE_API_TOKEN）から読む。リポジトリには入れない。
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ロックファイルがないので、ロックを作らずに入れる
      - name: Install
        run: npm install --no-package-lock

      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # まいかの Cloudflare アカウントID（秘密の値ではない）
          CLOUDFLARE_ACCOUNT_ID: d3c846e856f149ff7b1c12256aa1d70a
